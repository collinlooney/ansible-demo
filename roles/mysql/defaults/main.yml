---
# Generic MySQL server provisioning. Used only by integration tests today;
# production Keycloak reuses the existing prod MySQL instance.

# dpkg options for apt installs (ansible.builtin.apt's own dpkg_options).
# Format: comma-separated, no leading dashes — the module adds "--" itself
# (expand_dpkg_options in ansible/modules/apt.py). Stock behavior: per-file
# fsync during unpack — the production-safe default. The inttest scripts opt
# into force-unsafe-io via --extra-vars (their flag defaults to on; see
# scripts/flags.ts). Measured ~4.3min off a 360-package install on btrfs —
# docs/perf.md.
apt_dpkg_options: 'force-confdef,force-confold'

mysql_bind_address: 127.0.0.1
mysql_port: 3306
# See roles/mysql/templates/zz-ansible.cnf.j2 — required by community.mysql's
# password handling on MySQL 8.4 (plugin disabled by default there).
mysql_enable_native_password: true
# Throwaway inttest datastore: relax per-commit fsync so first-boot schema
# initialization (Liquibase, ~1 DDL/s when fsync-bound) finishes in seconds.
# Prod never uses this role (Keycloak reuses the existing shared MySQL).
mysql_test_throughput: true
mysql_databases: []
mysql_users: []
